name: Build and Release Font

# Triggered by version tags (e.g. v1.0.0)
# To release: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        default: "v0.0.0-test"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load pinned font toolchain
        id: toolchain
        run: |
          manifest=".github/font-toolchain.json"
          {
            echo "iosevka_repository=$(jq -r '.iosevka.repository' "$manifest")"
            echo "iosevka_tag=$(jq -r '.iosevka.tag' "$manifest")"
            echo "nerd_fonts_repository=$(jq -r '.nerdFonts.repository' "$manifest")"
            echo "nerd_fonts_tag=$(jq -r '.nerdFonts.tag' "$manifest")"
            echo "nerd_fonts_patcher_sha256=$(jq -r '.nerdFonts.patcherSha256' "$manifest")"
            echo "fonttools_version=$(jq -r '.fontTools.version' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Iosevka source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.toolchain.outputs.iosevka_repository }}
          ref: ${{ steps.toolchain.outputs.iosevka_tag }}
          path: iosevka-src
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint python3 fontforge

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install webfont tooling
        run: |
          python -m pip install \
            "fonttools[woff]==${{ steps.toolchain.outputs.fonttools_version }}"

      - name: Build font
        run: |
          cp private-build-plans.toml iosevka-src/
          cd iosevka-src
          npm ci
          npm run build -- contents::NoisyMono contents::NoisyMonoTerm contents::NoisyMonoNL

      - name: Verify build output
        run: |
          if [ ! -d "iosevka-src/dist/NoisyMono/TTF" ] || [ ! -d "iosevka-src/dist/NoisyMono/WOFF2" ]; then
            echo "NoisyMono build output not found!"
            exit 1
          fi
          if [ ! -d "iosevka-src/dist/NoisyMonoTerm/TTF" ]; then
            echo "NoisyMonoTerm build output not found!"
            exit 1
          fi
          if [ ! -d "iosevka-src/dist/NoisyMonoNL/TTF" ]; then
            echo "NoisyMonoNL build output not found!"
            exit 1
          fi

      - name: Download Nerd Fonts patcher
        run: |
          patcher_url="https://github.com/${{ steps.toolchain.outputs.nerd_fonts_repository }}/releases/download/${{ steps.toolchain.outputs.nerd_fonts_tag }}/FontPatcher.zip"
          curl --fail --location --show-error --silent \
            "$patcher_url" \
            --output FontPatcher.zip
          echo "${{ steps.toolchain.outputs.nerd_fonts_patcher_sha256 }}  FontPatcher.zip" \
            | sha256sum --check -
          unzip -q FontPatcher.zip -d nerd-fonts-patcher

      # Iosevka encodes the width inside the weight name:
      #   Normal        → NoisyMono-{Weight}.ttf
      #   SemiCondensed → NoisyMono-SemiCondensed{Weight}.ttf
      #   Condensed     → NoisyMono-Condensed{Weight}.ttf
      - name: Patch fonts with Nerd Font glyphs
        run: |
          mkdir -p patched-fonts/Normal patched-fonts/SemiCondensed patched-fonts/Condensed
          mkdir -p patched-fonts-term/Normal patched-fonts-term/SemiCondensed patched-fonts-term/Condensed
          mkdir -p patched-fonts-nl/Normal patched-fonts-nl/SemiCondensed patched-fonts-nl/Condensed
          DIST="iosevka-src/dist/NoisyMono/TTF"
          DIST_TERM="iosevka-src/dist/NoisyMonoTerm/TTF"
          DIST_NL="iosevka-src/dist/NoisyMonoNL/TTF"
          PATCHER="nerd-fonts-patcher/font-patcher"

          for font in "$DIST"/NoisyMono-SemiCondensed*.ttf; do
            fontforge -script "$PATCHER" "$font" --complete --careful --mono --outputdir patched-fonts/SemiCondensed
          done

          for font in "$DIST"/NoisyMono-Condensed*.ttf; do
            [[ "$font" == *SemiCondensed* ]] && continue
            fontforge -script "$PATCHER" "$font" --complete --careful --mono --outputdir patched-fonts/Condensed
          done

          for font in "$DIST"/NoisyMono-*.ttf; do
            [[ "$font" == *Condensed* ]] && continue
            fontforge -script "$PATCHER" "$font" --complete --careful --mono --outputdir patched-fonts/Normal
          done

          for font in "$DIST_TERM"/NoisyMonoTerm-SemiCondensed*.ttf; do
            fontforge -script "$PATCHER" "$font" --complete --careful --mono --outputdir patched-fonts-term/SemiCondensed
          done

          for font in "$DIST_TERM"/NoisyMonoTerm-Condensed*.ttf; do
            [[ "$font" == *SemiCondensed* ]] && continue
            fontforge -script "$PATCHER" "$font" --complete --careful --mono --outputdir patched-fonts-term/Condensed
          done

          for font in "$DIST_TERM"/NoisyMonoTerm-*.ttf; do
            [[ "$font" == *Condensed* ]] && continue
            fontforge -script "$PATCHER" "$font" --complete --careful --mono --outputdir patched-fonts-term/Normal
          done

          for font in "$DIST_NL"/NoisyMonoNL-SemiCondensed*.ttf; do
            fontforge -script "$PATCHER" "$font" --complete --careful --mono --outputdir patched-fonts-nl/SemiCondensed
          done

          for font in "$DIST_NL"/NoisyMonoNL-Condensed*.ttf; do
            [[ "$font" == *SemiCondensed* ]] && continue
            fontforge -script "$PATCHER" "$font" --complete --careful --mono --outputdir patched-fonts-nl/Condensed
          done

          for font in "$DIST_NL"/NoisyMonoNL-*.ttf; do
            [[ "$font" == *Condensed* ]] && continue
            fontforge -script "$PATCHER" "$font" --complete --careful --mono --outputdir patched-fonts-nl/Normal
          done

      - name: Finalize and validate Nerd Font metadata
        run: |
          ./scripts/finalize-nerd-fonts.py \
            patched-fonts \
            patched-fonts-term \
            patched-fonts-nl

      - name: Package release archives
        run: |
          DIST="iosevka-src/dist/NoisyMono"
          DIST_TERM="iosevka-src/dist/NoisyMonoTerm"

          # ── NoisyMono.zip — all widths, TTF hinted + unhinted ──────────
          mkdir -p pkg/Normal/Hinted      pkg/Normal/Unhinted
          mkdir -p pkg/SemiCondensed/Hinted pkg/SemiCondensed/Unhinted
          mkdir -p pkg/Condensed/Hinted   pkg/Condensed/Unhinted

          cp "$DIST"/TTF/NoisyMono-SemiCondensed*.ttf          pkg/SemiCondensed/Hinted/
          cp "$DIST"/TTF-Unhinted/NoisyMono-SemiCondensed*.ttf pkg/SemiCondensed/Unhinted/

          for f in "$DIST"/TTF/NoisyMono-Condensed*.ttf;          do [[ "$f" == *SemiCondensed* ]] && continue; cp "$f" pkg/Condensed/Hinted/;    done
          for f in "$DIST"/TTF-Unhinted/NoisyMono-Condensed*.ttf; do [[ "$f" == *SemiCondensed* ]] && continue; cp "$f" pkg/Condensed/Unhinted/;  done
          for f in "$DIST"/TTF/NoisyMono-*.ttf;                   do [[ "$f" == *Condensed* ]]     && continue; cp "$f" pkg/Normal/Hinted/;        done
          for f in "$DIST"/TTF-Unhinted/NoisyMono-*.ttf;          do [[ "$f" == *Condensed* ]]     && continue; cp "$f" pkg/Normal/Unhinted/;      done

          cp LICENSE FONTLOG.txt pkg/
          cd pkg && zip -r ../NoisyMono.zip . && cd ..

          # ── NoisyMono-NerdFont.zip — all widths, Nerd Font patched ─────
          mkdir -p pkg-nf/Normal pkg-nf/SemiCondensed pkg-nf/Condensed
          cp patched-fonts/Normal/*.ttf         pkg-nf/Normal/
          cp patched-fonts/SemiCondensed/*.ttf  pkg-nf/SemiCondensed/
          cp patched-fonts/Condensed/*.ttf      pkg-nf/Condensed/
          cp LICENSE FONTLOG.txt pkg-nf/
          cd pkg-nf && zip -r ../NoisyMono-NerdFont.zip . && cd ..

          # ── NoisyMono-Term.zip — all widths, term spacing ──────────────
          mkdir -p pkg-term/Normal/Hinted      pkg-term/Normal/Unhinted
          mkdir -p pkg-term/SemiCondensed/Hinted pkg-term/SemiCondensed/Unhinted
          mkdir -p pkg-term/Condensed/Hinted   pkg-term/Condensed/Unhinted

          cp "$DIST_TERM"/TTF/NoisyMonoTerm-SemiCondensed*.ttf          pkg-term/SemiCondensed/Hinted/
          cp "$DIST_TERM"/TTF-Unhinted/NoisyMonoTerm-SemiCondensed*.ttf pkg-term/SemiCondensed/Unhinted/

          for f in "$DIST_TERM"/TTF/NoisyMonoTerm-Condensed*.ttf;          do [[ "$f" == *SemiCondensed* ]] && continue; cp "$f" pkg-term/Condensed/Hinted/;   done
          for f in "$DIST_TERM"/TTF-Unhinted/NoisyMonoTerm-Condensed*.ttf; do [[ "$f" == *SemiCondensed* ]] && continue; cp "$f" pkg-term/Condensed/Unhinted/; done
          for f in "$DIST_TERM"/TTF/NoisyMonoTerm-*.ttf;                   do [[ "$f" == *Condensed* ]]     && continue; cp "$f" pkg-term/Normal/Hinted/;       done
          for f in "$DIST_TERM"/TTF-Unhinted/NoisyMonoTerm-*.ttf;          do [[ "$f" == *Condensed* ]]     && continue; cp "$f" pkg-term/Normal/Unhinted/;     done

          cp LICENSE FONTLOG.txt pkg-term/
          cd pkg-term && zip -r ../NoisyMono-Term.zip . && cd ..

          # ── NoisyMono-NL.zip — all widths, no ligatures ────────────────
          DIST_NL="iosevka-src/dist/NoisyMonoNL"
          mkdir -p pkg-nl/Normal/Hinted      pkg-nl/Normal/Unhinted
          mkdir -p pkg-nl/SemiCondensed/Hinted pkg-nl/SemiCondensed/Unhinted
          mkdir -p pkg-nl/Condensed/Hinted   pkg-nl/Condensed/Unhinted

          cp "$DIST_NL"/TTF/NoisyMonoNL-SemiCondensed*.ttf          pkg-nl/SemiCondensed/Hinted/
          cp "$DIST_NL"/TTF-Unhinted/NoisyMonoNL-SemiCondensed*.ttf pkg-nl/SemiCondensed/Unhinted/

          for f in "$DIST_NL"/TTF/NoisyMonoNL-Condensed*.ttf;          do [[ "$f" == *SemiCondensed* ]] && continue; cp "$f" pkg-nl/Condensed/Hinted/;   done
          for f in "$DIST_NL"/TTF-Unhinted/NoisyMonoNL-Condensed*.ttf; do [[ "$f" == *SemiCondensed* ]] && continue; cp "$f" pkg-nl/Condensed/Unhinted/; done
          for f in "$DIST_NL"/TTF/NoisyMonoNL-*.ttf;                   do [[ "$f" == *Condensed* ]]     && continue; cp "$f" pkg-nl/Normal/Hinted/;       done
          for f in "$DIST_NL"/TTF-Unhinted/NoisyMonoNL-*.ttf;          do [[ "$f" == *Condensed* ]]     && continue; cp "$f" pkg-nl/Normal/Unhinted/;     done

          cp LICENSE FONTLOG.txt pkg-nl/
          cd pkg-nl && zip -r ../NoisyMono-NL.zip . && cd ..

          # ── NoisyMono-Term-NerdFont.zip — term spacing + Nerd Font ─────
          mkdir -p pkg-term-nf/Normal pkg-term-nf/SemiCondensed pkg-term-nf/Condensed
          cp patched-fonts-term/Normal/*.ttf         pkg-term-nf/Normal/
          cp patched-fonts-term/SemiCondensed/*.ttf  pkg-term-nf/SemiCondensed/
          cp patched-fonts-term/Condensed/*.ttf      pkg-term-nf/Condensed/
          cp LICENSE FONTLOG.txt pkg-term-nf/
          cd pkg-term-nf && zip -r ../NoisyMono-Term-NerdFont.zip . && cd ..

          # ── NoisyMono-NL-NerdFont.zip — no ligatures + Nerd Font ───────
          mkdir -p pkg-nl-nf/Normal pkg-nl-nf/SemiCondensed pkg-nl-nf/Condensed
          cp patched-fonts-nl/Normal/*.ttf         pkg-nl-nf/Normal/
          cp patched-fonts-nl/SemiCondensed/*.ttf  pkg-nl-nf/SemiCondensed/
          cp patched-fonts-nl/Condensed/*.ttf      pkg-nl-nf/Condensed/
          cp LICENSE FONTLOG.txt pkg-nl-nf/
          cd pkg-nl-nf && zip -r ../NoisyMono-NL-NerdFont.zip . && cd ..

      - name: Package curated Web archive
        env:
          FONTTOOLS_VERSION: ${{ steps.toolchain.outputs.fonttools_version }}
        run: |
          mkdir -p pkg-web/fonts
          ./scripts/subset-webfonts.sh \
            iosevka-src/dist/NoisyMono/WOFF2-Unhinted \
            pkg-web/fonts
          ./scripts/generate-webfont-css.py \
            pkg-web/fonts \
            pkg-web/noisy-mono.css
          ./scripts/validate-webfonts.py \
            pkg-web/fonts \
            --expected-count 60
          cp webfonts/README.md pkg-web/README.md
          cp LICENSE pkg-web/LICENSE
          cp FONTLOG.txt pkg-web/FONTLOG.txt
          (cd pkg-web && zip -r ../NoisyMono-Web.zip .)

      - name: Package full-glyph Web archive
        run: |
          mkdir -p pkg-web-full
          cp -R iosevka-src/dist/NoisyMono/WOFF2 pkg-web-full/
          cp -R iosevka-src/dist/NoisyMono/WOFF2-Unhinted pkg-web-full/
          cp LICENSE FONTLOG.txt pkg-web-full/
          (cd pkg-web-full && zip -r ../NoisyMono-Web-Full.zip .)

      - name: Set release version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Noisy Mono ${{ steps.vars.outputs.tag }}"
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body: |
            ## Noisy Mono ${{ steps.vars.outputs.tag }}

            <!-- What's new in this release -->

            ---

            ### Downloads

            | Situation | Download |
            |---|---|
            | Editor / IDE | `NoisyMono.zip` |
            | Terminal with icons | `NoisyMono-NerdFont.zip` |
            | Terminal rendering issues | `NoisyMono-Term.zip` |
            | Terminal icons + rendering issues | `NoisyMono-Term-NerdFont.zip` |
            | App that can't disable ligatures | `NoisyMono-NL.zip` |
            | Same + Nerd Font icons | `NoisyMono-NL-NerdFont.zip` |
            | Web (curated Latin/technical subsets + CSS) | `NoisyMono-Web.zip` |
            | Web (complete glyph repertoire) | `NoisyMono-Web-Full.zip` |

            Not sure which to pick? See the README in this repository.
          files: |
            NoisyMono.zip
            NoisyMono-NerdFont.zip
            NoisyMono-Term.zip
            NoisyMono-Term-NerdFont.zip
            NoisyMono-NL.zip
            NoisyMono-NL-NerdFont.zip
            NoisyMono-Web.zip
            NoisyMono-Web-Full.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
