name: Build Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version (e.g. v1.0.0 or v1.0.0-rc.1)"
        required: true
        default: "v1.0.0"

concurrency:
  group: font-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set candidate version and reproducible timestamp
        id: vars
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $tag" >&2
            exit 1
          fi

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"

      - name: Load pinned font toolchain
        id: toolchain
        run: |
          manifest=".github/font-toolchain.json"
          {
            echo "iosevka_repository=$(jq -r '.iosevka.repository' "$manifest")"
            echo "iosevka_tag=$(jq -r '.iosevka.tag' "$manifest")"
            echo "nerd_fonts_repository=$(jq -r '.nerdFonts.repository' "$manifest")"
            echo "nerd_fonts_tag=$(jq -r '.nerdFonts.tag' "$manifest")"
            echo "nerd_fonts_patcher_sha256=$(jq -r '.nerdFonts.patcherSha256' "$manifest")"
            echo "fonttools_version=$(jq -r '.fontTools.version' "$manifest")"
            echo "node_version=$(jq -r '.runtime.node' "$manifest")"
            echo "python_version=$(jq -r '.runtime.python' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Iosevka source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.toolchain.outputs.iosevka_repository }}
          ref: ${{ steps.toolchain.outputs.iosevka_tag }}
          path: iosevka-src
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint python3 fontforge

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}
          cache: npm
          cache-dependency-path: iosevka-src/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python_version }}

      - name: Install webfont tooling
        run: |
          python -m pip install \
            "fonttools[woff]==${{ steps.toolchain.outputs.fonttools_version }}"

      - name: Build font
        run: |
          cp private-build-plans.toml iosevka-src/
          cd iosevka-src
          npm ci
          # Each Iosevka command job can exceed 1 GiB at peak. Keep enough
          # headroom for the runner instead of using every CPU.
          npm run build -- \
            --jCmd=2 \
            ttf-unhinted::NoisyMono \
            ttf-unhinted::NoisyMonoTerm \
            ttf-unhinted::NoisyMonoNL \
            woff2-unhinted::NoisyMono

      - name: Normalize TrueType glyph records
        run: |
          python scripts/normalize-ttf.py \
            iosevka-src/dist/NoisyMono/TTF-Unhinted \
            iosevka-src/dist/NoisyMonoTerm/TTF-Unhinted \
            iosevka-src/dist/NoisyMonoNL/TTF-Unhinted

      - name: Hint normalized desktop fonts
        run: python scripts/hint-ttf.py iosevka-src

      - name: Build hinted full-glyph webfonts
        run: |
          python scripts/convert-ttf-to-woff2.py \
            iosevka-src/dist/NoisyMono/TTF \
            iosevka-src/dist/NoisyMono/WOFF2

      - name: Verify build output
        run: python scripts/validate-build-output.py iosevka-src

      - name: Download Nerd Fonts patcher
        run: |
          patcher_url="https://github.com/${{ steps.toolchain.outputs.nerd_fonts_repository }}/releases/download/${{ steps.toolchain.outputs.nerd_fonts_tag }}/FontPatcher.zip"
          curl --fail --location --show-error --silent \
            "$patcher_url" \
            --output FontPatcher.zip
          echo "${{ steps.toolchain.outputs.nerd_fonts_patcher_sha256 }}  FontPatcher.zip" \
            | sha256sum --check -
          unzip -q FontPatcher.zip -d nerd-fonts-patcher

      # Iosevka encodes the width inside the weight name:
      #   Normal        → NoisyMono-{Weight}.ttf
      #   SemiCondensed → NoisyMono-SemiCondensed{Weight}.ttf
      #   Condensed     → NoisyMono-Condensed{Weight}.ttf
      - name: Patch fonts with Nerd Font glyphs
        run: |
          python scripts/patch-nerd-fonts.py \
            iosevka-src \
            nerd-fonts-patcher/font-patcher \
            .

      - name: Finalize and validate Nerd Font metadata
        run: |
          ./scripts/finalize-nerd-fonts.py \
            patched-fonts \
            patched-fonts-term \
            patched-fonts-nl

      - name: Package desktop and full-glyph Web archives
        run: |
          python scripts/package-release-archives.py \
            iosevka-src \
            . \
            . \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Package curated Web archive
        env:
          FONTTOOLS_VERSION: ${{ steps.toolchain.outputs.fonttools_version }}
        run: |
          mkdir -p pkg-web/fonts
          ./scripts/subset-webfonts.sh \
            iosevka-src/dist/NoisyMono/WOFF2-Unhinted \
            pkg-web/fonts
          ./scripts/generate-webfont-css.py \
            pkg-web/fonts \
            pkg-web/noisy-mono.css
          ./scripts/validate-webfonts.py \
            pkg-web/fonts \
            --expected-count 60
          cp webfonts/README.md pkg-web/README.md
          cp LICENSE pkg-web/LICENSE
          cp FONTLOG.txt pkg-web/FONTLOG.txt
          python scripts/package-directory.py \
            pkg-web \
            NoisyMono-Web.zip \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Validate complete release candidate
        run: |
          python scripts/validate-release.py . \
            --version "${{ steps.vars.outputs.tag }}" \
            --source-sha "$GITHUB_SHA" \
            --write-manifest release-manifest.json \
            --write-checksums SHA256SUMS

      - name: Preserve validated candidate
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NoisyMono-${{ steps.vars.outputs.tag }}-candidate
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: |
            NoisyMono.zip
            NoisyMono-NerdFont.zip
            NoisyMono-Term.zip
            NoisyMono-Term-NerdFont.zip
            NoisyMono-NL.zip
            NoisyMono-NL-NerdFont.zip
            NoisyMono-Web.zip
            NoisyMono-Web-Full.zip
            SHA256SUMS
            release-manifest.json
